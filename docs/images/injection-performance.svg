<path d="M200 120 v6 h298 v-6" fill="none" stroke="#A32D2D" stroke-width="0.8"/>
<text x="349" y="139" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">68 × BinaryImage::parse ≈ 16.7 s — and every site rewrote the whole file</text>

