<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img">
<title>One injection pass: 44.3 s before, 8.2 s after</title>
<desc>Where a single armcave injection run goes, and what it costs before and after the fix. Cold, first injection: 44.3 s before, 8.2 s after, 5.4x faster. Warm page cache: 8.6 s before, 8.3 s after, roughly 1.0x — the fix moves the floor, not the warm number. The 44.3 s cold run is dominated by the direct patch loop: 68 sites each re-read and re-wrote the whole 24 MB image and re-parsed the Mach-O.</desc>
<style>
  .t{fill:#2C2C2A}.c{fill:#6B6A66}.l{fill:#2C2C2A}.s{fill:#6B6A66}
  @media (prefers-color-scheme:dark){ .t{fill:#D3D1C7}.c{fill:#A9A79E}.l{fill:#B4B2A9}.s{fill:#A9A79E} }
</style>

<text class="t" x="40" y="24" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500">One injection pass: 44.3 s → 8.2 s</text>
<text class="c" x="40" y="42" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" dominant-baseline="central">armcave on Arc-mobile.mac-catalyst (24.3 MB, 5 plugins, 68 direct patches, 14 hook sites), Apple Silicon, one thread ~96% busy</text>

<text x="40" y="74" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#A32D2D" dominant-baseline="central">Cold, first injection — before: 44.3 s</text>

