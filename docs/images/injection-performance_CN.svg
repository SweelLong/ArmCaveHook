<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img">
<title>一趟注入：44.3 s → 8.2 s</title>
<desc>armcave 单趟注入的耗时分解与优化前后对比。冷启动（首次注入）：优化前 44.3 s，优化后 8.2 s，快 5.4 倍；页缓存预热：8.6 s 对 8.3 s，约 1.0 倍——修复抬的是地板，不是温热数字。冷启动 44.3 s 里的大头是直接补丁循环：68 个位点每个都重读、重写整个 24 MB 镜像并从头解析一遍 Mach-O。</desc>
<style>
  .t{fill:#2C2C2A}.c{fill:#6B6A66}.l{fill:#2C2C2A}.s{fill:#6B6A66}
  @media (prefers-color-scheme:dark){ .t{fill:#D3D1C7}.c{fill:#A9A79E}.l{fill:#B4B2A9}.s{fill:#A9A79E} }
</style>

<text class="t" x="40" y="24" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="500">一趟注入：44.3 s → 8.2 s</text>
<text class="c" x="40" y="42" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" dominant-baseline="central">armcave 打补丁，配置 Arc-mobile.mac-catalyst（24.3 MB，5 插件，68 条直接补丁，14 个 hook 位点），Apple Silicon，单核约 96% 占用</text>

<text x="40" y="74" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#A32D2D" dominant-baseline="central">冷启动（首次注入）· 优化前 44.3 s</text>

<rect x="200" y="86" width="298" height="28" rx="4" fill="#A32D2D" stroke="#5F5E5A" stroke-width="0.4"/>
<text x="349" y="100" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">直接补丁循环 · 68 个位点 · 30.0 s</text>
<rect x="498" y="86" width="58.6" height="28" rx="4" fill="#C15A54" stroke="#5F5E5A" stroke-width="0.4"/>
<rect x="556.6" y="86" width="21.9" height="28" rx="4" fill="#D58A85" stroke="#5F5E5A" stroke-width="0.4"/>
<rect x="578.5" y="86" width="15.4" height="28" rx="4" fill="#E0ACA8" stroke="#5F5E5A" stroke-width="0.4"/>
<rect x="593.9" y="86" width="9.9" height="28" rx="4" fill="#EAC7C4" stroke="#5F5E5A" stroke-width="0.4"/>
<rect x="603.8" y="86" width="6.7" height="28" rx="4" fill="#F0D8D6" stroke="#5F5E5A" stroke-width="0.4"/>
<rect x="610.4" y="86" width="2.6" height="28" rx="4" fill="#F5EAE9" stroke="#5F5E5A" stroke-width="0.4"/>
<rect x="613" y="86" width="27" height="28" rx="4" fill="#DDDAD3" stroke="#5F5E5A" stroke-width="0.4"/>

<path d="M200 120 v6 h298 v-6" fill="none" stroke="#A32D2D" stroke-width="0.8"/>
<text x="349" y="139" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">68 次 BinaryImage::parse ≈ 16.7 s，且每个位点都重写整个文件</text>

<rect x="44" y="150" width="10" height="10" rx="2" fill="#A32D2D"/>
<text x="60" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">直接补丁循环 ×68 · 30.0 s</text>
<rect x="44" y="168" width="10" height="10" rx="2" fill="#C15A54"/>
<text x="60" y="174" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">hook 窗口写入 · 5.9 s</text>
<rect x="44" y="186" width="10" height="10" rx="2" fill="#D58A85"/>
<text x="60" y="192" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">插件段写入 · 2.2 s</text>
<rect x="44" y="204" width="10" height="10" rx="2" fill="#E0ACA8"/>
<text x="60" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">插件 clang++ 编译 · 1.55 s</text>

<rect x="354" y="150" width="10" height="10" rx="2" fill="#EAC7C4"/>
<text x="370" y="156" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">blob 构建 · 1.0 s</text>
<rect x="354" y="168" width="10" height="10" rx="2" fill="#F0D8D6"/>
<text x="370" y="174" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">add_segments · 0.67 s</text>
<rect x="354" y="186" width="10" height="10" rx="2" fill="#F5EAE9"/>
<text x="370" y="192" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">codesign ×14 · 0.26 s</text>
<rect x="354" y="204" width="10" height="10" rx="2" fill="#DDDAD3"/>
<text x="370" y="210" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" class="l" dominant-baseline="central">其余 · 2.7 s</text>

<text x="40" y="244" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="500" fill="#3B6D11" dominant-baseline="central">优化后 · 8.2 s</text>
<text x="98" y="244" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">只剩插件编译、段布局与 codesign · 五次实测中位数（8.05 / 8.11 / 8.23 / 8.56 / 9.08 s）</text>
<rect x="200" y="252" width="80.2" height="28" rx="4" fill="#8FBF5C" stroke="#3B6D11" stroke-width="0.5"/>

