<text class="c" x="40" y="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10" dominant-baseline="central">44.3 s 是页缓存全空的冷启动；预热之后两版都稳定在 8.3 s 上下——修复抬的是地板，不是温热数字</text>

