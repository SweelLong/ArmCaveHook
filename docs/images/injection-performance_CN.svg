<text x="280" y="366" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="500" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">44.3 s</text>
<text x="440" y="366" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">8.6 s</text>
