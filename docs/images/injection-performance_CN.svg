<text x="280" y="341" class="c" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" text-anchor="middle" dominant-baseline="central">冷启动 · 首次注入</text>
<text x="440" y="341" class="c" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" text-anchor="middle" dominant-baseline="central">预热 · 页缓存</text>
<text x="580" y="341" class="c" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" text-anchor="middle" dominant-baseline="central">提速</text>
