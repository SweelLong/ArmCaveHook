# ArmCaveHook configuration
# Lines starting with # are comments.
# All paths are relative to the project root directory.

# --- Global settings (shared by all profiles) ---
plugins = ArmCaveHook-Arcplugins/plugins
build_dir = build

# --- Android profile ---
[android]
enable = true
