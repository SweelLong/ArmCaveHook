# ArmCaveHook configuration
# Lines starting with # are comments.
# All paths are relative to the project root directory.

# Input binary (required)
input = binaries/Arc-mobile

# Output patched binary (required)
output = binaries/Arc-mobile.patched

# Plugin source directory (required)
plugins = plugins

# CMake build directory (required)
build_dir = build

# Plugin whitelist — comma-separated, only these plugins are compiled.
# Empty or commented out = compile all plugins in directory.
plugin_whitelist = arc_rating.cpp, arc_autoplay.cpp

# Plugin blacklist — comma-separated, skip these plugins.
# Takes precedence over whitelist if whitelist is empty.
# plugin_blacklist = arc_test.cpp
